# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# NOTE: the previous version left `package-ecosystem` at the empty template
# placeholder, which is not a valid value. Dependabot rejected the file, so no
# version updates ever ran. Only Dependabot *security* updates (configured in
# the repository settings, not here) were active.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Keep PR noise down: patch/minor bumps arrive as one PR per group.
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
